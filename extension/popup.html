<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE COPILOT</title>
  <style>
    .line-copilot-popup { width: 300px; box-sizing: border-box; margin: 0; padding: 20px; color: #17212b; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .line-copilot-popup-header { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid #e8ebef; }
    .line-copilot-popup-mark { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; color: #fff; background: #06c755; font-size: 12px; font-weight: 800; }
    .line-copilot-popup-title { margin: 0; font-size: 18px; }
    .line-copilot-popup-version { margin: 2px 0 0; color: #77838f; font-size: 11px; }
    .line-copilot-popup-message { margin: 16px 0 0; font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body class="line-copilot-popup">
  <header class="line-copilot-popup-header">
    <span class="line-copilot-popup-mark">LC</span>
    <div>
      <h1 class="line-copilot-popup-title">LINE COPILOT</h1>
      <p class="line-copilot-popup-version">版本 <span id="line-copilot-popup-version">1.3.0</span></p>
    </div>
  </header>
  <p class="line-copilot-popup-message">請開啟 LINE Official Account Manager 使用 LINE COPILOT。</p>
  <script src="popup.js"></script>
</body>
</html>
